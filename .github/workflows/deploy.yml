name: "build -> push -> deploy"
# Deploys are triggered by a release tag, not by pushing to a branch.
# Tag format: <date>.release-<n>, e.g. 2026-11-02.release-1.
# Create the tag with `bun run cut-release` (scripts/cut-release.ts).
on:
  push:
    tags:
      - "[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9].release-*"
  workflow_dispatch:

# Never cancel a deploy halfway; a second release waits for the first.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: read
      packages: write
    uses: TIHLDE/tihlde-workflows/.github/workflows/_ci_ghcr.yml@main
    with:
      context: .
      dockerfile: ./Dockerfile

  deploy:
    needs: build
    uses: TIHLDE/tihlde-workflows/.github/workflows/_notify_deploy.yml@main
    secrets:
      DEPLOY_RECEIVER_TOKEN: ${{ secrets.DEPLOY_RECEIVER_TOKEN }}

name: "build -> push -> deploy"
on:
  push:
    branches: [main]
  workflow_dispatch:

# A new push supersedes the previous run for the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: read
      packages: write
    uses: TIHLDE/tihlde-workflows/.github/workflows/_ci_ghcr.yml@main
    with:
      context: .
      dockerfile: ./Dockerfile

  deploy:
    needs: build
    uses: TIHLDE/tihlde-workflows/.github/workflows/_notify_deploy.yml@main
    secrets:
      DEPLOY_RECEIVER_TOKEN: ${{ secrets.DEPLOY_RECEIVER_TOKEN }}
